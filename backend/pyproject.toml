[project]
name = "haccpflow-backend"
version = "0.1.0"
description = "haccpFlow backend API (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30,<0.31",
    "fastapi>=0.115,<1",
    "paho-mqtt>=2.1,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    # starlette 1.7 deprecates httpx for TestClient and expects httpx2.
    "httpx2>=2.13,<3",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

# The backend is an application, not a library: nothing is installed into the
# environment from this project. Code is run from the working directory.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "C4", "DTZ", "E", "F", "I", "N", "RUF", "UP"]
ignore = [
    # FastAPI dependency injection relies on Depends() in argument defaults.
    "B008",
    # FastAPI route handlers are async even when they await nothing.
    "RUF029",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The migrations directory is named `alembic`, which would otherwise make ruff
# classify the real alembic package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a PostgreSQL reachable through TEST_DATABASE_URL",
]
