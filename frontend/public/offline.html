<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>haccpFlow — Hors ligne</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #0f172a;
        background:
          radial-gradient(circle at top right, rgb(20 184 166 / 18%), transparent 35%),
          #f8fafc;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        text-align: center;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 50px rgb(15 23 42 / 10%);
      }
      img {
        width: 88px;
        height: 88px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 auto;
        max-width: 340px;
        color: #64748b;
        line-height: 1.6;
      }
      button {
        margin-top: 24px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: #0d9488;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="88" height="88" />
      <h1 id="title">Vous êtes hors ligne</h1>
      <p id="message">
        Les données HACCP ne sont pas mises en cache. Reconnectez-vous à Internet pour continuer.
      </p>
      <button id="retry" type="button">Réessayer</button>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith("en")) {
        document.documentElement.lang = "en";
        document.title = "haccpFlow — Offline";
        document.getElementById("title").textContent = "You are offline";
        document.getElementById("message").textContent =
          "HACCP data is not cached. Reconnect to the Internet to continue.";
        document.getElementById("retry").textContent = "Try again";
      }
      document.getElementById("retry").addEventListener("click", () => location.reload());
    </script>
  </body>
</html>
