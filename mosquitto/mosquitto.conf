# Minimal Mosquitto configuration for haccpFlow.
#
# Credentials are not stored in this file: the container entrypoint builds
# the password file from MQTT_USERNAME / MQTT_PASSWORD at startup.

per_listener_settings false

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwd

# Drop privileges once the broker is up.
user mosquitto
